name: Lint + publish gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input: pnpm/action-setup reads packageManager from
      # package.json, and specifying both makes v4 error out.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:rules:test
      - run: pnpm lint:md
      - run: uv run tools/validate_publish_markdown.py site/public/index.html site/public/status.html